# Builds the Windows release of D2R Companion with PyInstaller.
#
# PyInstaller cannot cross-compile, so the build runs on a Windows runner.
# - Tag push (v*)        -> build + attach D2RCompanion-windows.zip to a Release
# - workflow_dispatch    -> build only, zip available as a workflow artifact
#   (useful for testing builds before tagging)

name: build-windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install --upgrade pyinstaller Pillow numpy

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean d2r_companion.spec

      - name: Smoke test (launch GUI with a preloaded screenshot)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\D2RCompanion\D2RCompanion.exe" -ArgumentList "--image","d2screenshot.png" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "D2RCompanion.exe exited early (code $($p.ExitCode)) - startup crashed"
            exit 1
          }
          Write-Output "smoke test OK: process alive after 8s"
          Stop-Process -Id $p.Id -Force

      - name: Package (one-folder zip)
        shell: pwsh
        run: Compress-Archive -Path dist\D2RCompanion -DestinationPath D2RCompanion-windows.zip

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: D2RCompanion-windows
          path: D2RCompanion-windows.zip

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: D2RCompanion-windows.zip
          generate_release_notes: true
