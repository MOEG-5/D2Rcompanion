# Builds the Windows and Linux releases of D2R Companion with PyInstaller.
#
# PyInstaller cannot cross-compile, so each platform is built on its own
# runner OS (one job per platform via a build matrix):
#   - windows-latest: D2RCompanion-windows.zip  (one-folder, all bundled)
#   - ubuntu-22.04:   D2RCompanion-linux.zip    (oldest available runner
#                     glibc, so the binary runs on Ubuntu 22.04+, Fedora,
#                     Arch, ... — everything self-contained incl. the X11
#                     hotkey; no ImageMagick/notify-send needed)
#
# Triggers:
#   - tag push (v*)          -> both zips attached to a GitHub Release
#   - workflow_dispatch      -> both zips available as workflow artifacts
#     (handy for testing a build before tagging)

name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: D2RCompanion-windows.zip
          - os: ubuntu-22.04
            artifact: D2RCompanion-linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Windows: setup-python provides a self-contained Python 3.12 (tkinter
      # included).
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      # Linux: use the system python in a venv — tkinter comes from the distro
      # package (python3-tk). binutils (objdump) and libpython3.10 are needed
      # by PyInstaller; libxcb1 by Pillow's X11 ImageGrab.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv zip libxcb1 binutils libpython3.10

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        # numpy pinned to 2.0.2: numpy 2.2+ imports ucrtbase.crealf, which
        # Wine does not implement (breaks local Wine testing; harmless on
        # real Windows, but 2.0.2 works everywhere and is crealf-free).
        run: pip install --upgrade pyinstaller Pillow "numpy==2.0.2"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install --upgrade pyinstaller Pillow "numpy==2.0.2" python-xlib

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean d2r_companion.spec

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: venv/bin/pyinstaller --noconfirm --clean d2r_companion.spec

      - name: Smoke test (Windows — headless selftest)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Start-Process -Wait: a GUI-subsystem exe would NOT be waited on
          # by a plain '&' call in PowerShell (and $LASTEXITCODE would be
          # stale), so block explicitly and check the real exit code.
          $p = Start-Process -FilePath ".\dist\D2RCompanion\D2RCompanion.exe" -ArgumentList "--selftest","d2screenshot.png" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "selftest failed (exit $($p.ExitCode)) - scan engine broken"
            exit 1
          }
          Write-Output "smoke test OK: scan engine works in the bundle"

      - name: Smoke test (Linux — headless selftest)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out=$(./dist/D2RCompanion/D2RCompanion --selftest d2screenshot.png 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" != "0" ]; then
            echo "smoke test FAILED: selftest exited with $rc"
            exit 1
          fi
          echo "smoke test OK: scan engine works in the bundle"

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\D2RCompanion -DestinationPath ${{ matrix.artifact }}

      - name: Package (Linux zip)
        if: runner.os == 'Linux'
        shell: bash
        run: (cd dist && zip -qr ../${{ matrix.artifact }} D2RCompanion)

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Tag builds only: collect both zips and attach them to the Release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect zips from both builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.zip
          generate_release_notes: true
